# The version the next release APK is built with.
#
# versionCode is what Android compares when installing over an existing copy: it
# must go up every time, or the phone refuses the update. "run.bat release"
# bumps it for you, so this file is not something to edit by hand.
#
# versionName is the human label. Change it whenever a release is worth a name.
versionCode=7
versionName=1.2
